<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Skiing · WebAR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
    body.ar { background: transparent; }
    canvas { touch-action: none; }
    #info {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 16px; text-align: center; font-size: 15px; line-height: 1.4;
      background: linear-gradient(#000a, #0000); pointer-events: none; z-index: 2;
    }
    #info b { color: #ffd23f; }
    /* Bottom bar: back button sits left of three.js' AR button, styled to match it */
    #bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: stretch; gap: 10px; z-index: 3; pointer-events: none; }
    #bar > :not(#back) { position: static !important; pointer-events: auto; }
    #back {
      display: flex; align-items: center; padding: 12px 10px; border: 1px solid #fff; border-radius: 4px;
      background: rgba(0,0,0,0.1); color: #fff; font: normal 13px sans-serif; text-decoration: none;
      opacity: .5; outline: none; pointer-events: auto;
    }
    #back:hover, #back:focus-visible { opacity: 1; }
    body.ar #back { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="bar"><a id="back" href="../">← EXPERIMENTS</a></div>
  <div id="info">Checking for WebXR AR support…</div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    /* =====================================================================
       Skiing in AR: the race from Jonas's game (diemmarkus/maze/skiing),
       drawn as a single pixel line on a board that hangs on a wall.
       Your run is the front layer; the CPU rides a second layer 12 cm behind.
       Pinch (or tap the screen) = tap in the original game, hold = salto.
       ===================================================================== */

    const info = document.getElementById('info');

    // --- Board: low-res pixel canvases, scaled up crisp ---
    const CW = 300, CH = 150;      // canvas pixels (4 mm per pixel on the board)
    const BW = 1.2, BH = 0.6;      // board size in metres (same pixel size as before, more slope in view)
    const DEPTH = 0.12;            // CPU layer sits 12 cm behind the player's layer
    const GAP = 0.01;              // back layer 1 cm off the wall

    // --- Texts (German / English) ---
    const LANG = {
      de: { title:'SKIING!', lvl:'LEVEL', yellow:'GELB = %D', orange:'ORANGE + HÜRDE = %J', hold:'$ HALTEN = SALTO', go:'$ = LOS!', lvlSel:'%d/%j: LEVEL ', duck:'DUCKEN', hop:'HÜPFEN', duckS:'DUCK', hopS:'HÜPF', keyDuck:'S', keyHop:'W', keyHold:'LEERTASTE', stand:'GERADE STEHEN', move:'LANG HALTEN = UMSETZEN',
            win:'GEWONNEN!', crash:'GESTÜRZT!', hurdle:'GESTÜRZT!', land:'BRUCHLANDUNG!', slow:'ZU LANGSAM!', next:'$ = WEITER', retry:'$ = NOCHMAL',
            time:'ZEIT', flips:'SALTOS', cpu:'CPU', wob:'WACKELIG!', finish:'ZIEL', goT:'LOS!',
            super:'SUPER!', good:'GUT!', oops:'HOPPLA!', jump:'SPRUNG!', flip:'SALTO!', flip2:'DOPPEL!', flip3:'DREIFACH!', ouch:'AUTSCH!',
            pinch:'PINCH', tap:'TIPP', placeWall:'$: Piste an diese Wand', place:'$: Piste hier · besser an eine Wand',
            pinchL:'Pinch', tapL:'Tippen',
            ok:'Tippe <b>Start AR</b>, schau auf eine Wand und pinche (oder tippe), um die Piste dort aufzuhängen. Gespielt wird mit dem Körper: <b>ducken</b> auf Gelb, <b>hüpfen</b> auf Orange und über Hürden, <b>Pinch halten</b> in der Luft = Salto.',
            noAr:'WebXR AR gibt’s hier nicht – unten eine spielbare Vorschau: <b>S</b>/↓ ducken, <b>W</b>/↑ hüpfen, <b>Leertaste</b> halten = Salto.<br>Für AR: <b>Chrome auf Android</b> oder <b>Spectacles</b>.',
            inAr:'Schau auf eine Wand und tippe' },
      en: { title:'SKIING!', lvl:'LEVEL', yellow:'YELLOW = %D', orange:'ORANGE + HURDLE = %J', hold:'HOLD $ = FLIP', go:'$ = GO!', lvlSel:'%d/%j: LEVEL ', duck:'DUCK', hop:'JUMP', duckS:'DUCK', hopS:'JUMP', keyDuck:'S', keyHop:'W', keyHold:'SPACE', stand:'STAND STILL', move:'LONG HOLD = MOVE',
            win:'YOU WIN!', crash:'WIPEOUT!', hurdle:'WIPEOUT!', land:'CRASH!', slow:'TOO SLOW!', next:'$ = NEXT', retry:'$ = AGAIN',
            time:'TIME', flips:'FLIPS', cpu:'CPU', wob:'WOBBLY!', finish:'FINISH', goT:'GO!',
            super:'SUPER!', good:'GOOD!', oops:'OOPS!', jump:'JUMP!', flip:'FLIP!', flip2:'DOUBLE!', flip3:'TRIPLE!', ouch:'OUCH!',
            pinch:'PINCH', tap:'TAP', placeWall:'$: put the slope on this wall', place:'$: put the slope here · a wall is best',
            pinchL:'Pinch', tapL:'Tap',
            ok:'Tap <b>Start AR</b>, look at a wall and pinch (or tap) to hang the slope there. You play with your body: <b>duck</b> on yellow, <b>jump</b> on orange and over hurdles, <b>hold a pinch</b> in the air to flip.',
            noAr:'WebXR AR isn’t available here – below is a playable preview: <b>S</b>/↓ duck, <b>W</b>/↑ jump, hold <b>space</b> = flip.<br>For AR use <b>Chrome on Android</b> or <b>Spectacles</b>.',
            inAr:'Look at a wall and tap' } };
    let langKey = 'de';
    try { const s = localStorage.getItem('irrgarten.lang'); langKey = LANG[s] ? s : ((navigator.language || 'de').startsWith('de') ? 'de' : 'en'); } catch (_) {}
    const T = LANG[langKey];
    document.documentElement.lang = langKey;

    // =====================================================================
    // Game logic (ported from the 1-player mode of the original)
    // =====================================================================
    function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

    const SLOPE=0.3, G=330, SPIN=720, VMIN=55;
    let TY_=null,KIND=null,MID=null,mogs=[],ramps=[],hurdles=[],finishX=0,LEN=0,level=1;
    const PROFILES={
      mix:{mog:2,ramp:1,hurd:1,gmin:4,gmax:7,A:[6,8.5]},
      moguls:{mog:4,ramp:.5,hurd:.6,gmin:7,gmax:11,A:[7.5,9.5]},
      ramps:{mog:1,ramp:2.4,hurd:.6,gmin:3,gmax:4,A:[5.5,7]},
      hurdles:{mog:1.2,ramp:.6,hurd:2.4,gmin:3,gmax:6,A:[6,8]}};
    function profileFor(lv){return lv===1?'mix':lv===2?'ramps':lv===3?'hurdles':['moguls','ramps','hurdles','mix'][(lv-4)%4]}
    function build(lv){
      const r=rng(lv*7919+17),prof=PROFILES[profileFor(lv)];
      const goal=Math.min(7500,1500+(lv-1)*550),N=goal+2400;
      TY_=new Float32Array(N);KIND=new Uint8Array(N);MID=new Int32Array(N).fill(-1);mogs=[];ramps=[];hurdles=[];
      let x=0,y=0;
      const put=(yy,k,id)=>{if(x<N){TY_[x]=yy;KIND[x]=k;MID[x]=id==null?-1:id}x++};
      for(let i=0;i<90;i++)put(y+=0.12,0);
      const moguls=n=>{for(let j=0;j<n;j++){
        const P=Math.round(42+r()*10-Math.min(lv,6)),A=prof.A[0]+r()*(prof.A[1]-prof.A[0]),id=mogs.length,x0=x,y0=y;
        mogs.push({x0,P});
        r(); // keeps the course identical to the original (it rolled for a tree here)
        for(let u=0;u<P;u++){const t=u/P;const k=t>=0.03&&t<=0.45?1:(t>=0.52&&t<=0.97?2:0);put(y0+SLOPE*u+A*(1-Math.cos(2*Math.PI*t))/2,k,id)}
        y=y0+SLOPE*P}};
      let nRamps=0;
      const ramp=()=>{
        const roll=r(),sz=(lv===1&&nRamps===0)?1:lv<=2?(roll<0.6?1:1.5):(roll<0.4?1:roll<0.72?1.5:2.1);nRamps++;
        for(let i=0;i<26;i++)put(y+=0.22,0);
        const L=Math.round(58*sz),hgt=22*sz,x0=x,y0=y;
        for(let i=0;i<L;i++){const t=i/L;put(y0+0.1*i-hgt*t*t,t<0.5?3:4)}
        const lip=x;y=y0+0.1*L-hgt;ramps.push({x0,L,lip,sz});
        y+=24*sz;
        const land=Math.round(300*sz),bend=land-80;
        for(let i=0;i<land;i++){const sl=i<bend?0.62:0.62-(0.32*(i-bend)/80);put(y+=sl,5)}
        for(let i=0;i<20;i++)put(y+=SLOPE,0)};
      const hurdleRun=()=>{
        const n=2+Math.floor(r()*(lv>=6?3:2));
        for(let i=0;i<70;i++)put(y+=0.5,6);
        for(let h=0;h<n;h++){
          const pool=[['fence',1],['snowman',1],['logs',1],['barrier',1],['cow',1],['goat',1],['yeti',0.25]];
          let roll=r()*pool.reduce((a,b)=>a+b[1],0),type='fence';for(const[t,wt]of pool){if((roll-=wt)<0){type=t;break}}
          const w={fence:10,snowman:8,logs:12,barrier:14,cow:14,goat:10,yeti:11}[type],hh={fence:9,snowman:12,logs:7,barrier:8,cow:10,goat:9,yeti:14}[type];
          hurdles.push({x,w,h:hh,type});
          const gap=230+Math.floor(r()*60);for(let i=0;i<gap;i++)put(y+=0.5,6);
        }
        for(let i=0;i<20;i++)put(y+=SLOPE,0)};
      let first=true,prev='',run=0;
      while(x<goal){
        let sec='mog';
        if(!first&&x<goal-500){
          const w={mog:prof.mog,ramp:prof.ramp,hurd:lv>=3&&prev!=='hurd'?prof.hurd:0};
          const roll=r()*(w.mog+w.ramp+w.hurd);sec=roll<w.mog?'mog':roll<w.mog+w.ramp?'ramp':'hurd';
          if(sec==='ramp'&&prev==='ramp'&&run>=3)sec='mog';
        }
        run=sec===prev?run+1:1;
        if(sec==='mog')moguls(first?Math.max(4,prof.gmin):prof.gmin+Math.floor(r()*(prof.gmax-prof.gmin+1)));
        else if(sec==='ramp')ramp();else hurdleRun();
        if(lv===3&&first){hurdleRun();prev='hurd'}else prev=sec;
        first=false;
      }
      finishX=x+30;
      while(x<N)put(y+=0.2,0);
      LEN=N;
    }
    function TY(x){if(x<=0)return TY_[0]+x*0.12;const i=Math.floor(x);if(i>=LEN-1)return TY_[LEN-1]+(x-LEN+1)*0.2;const f=x-i;return TY_[i]*(1-f)+TY_[i+1]*f}
    function slopeAt(x){return(TY(x+2)-TY(x-2))/4}
    function kindAt(x){const i=Math.floor(x);return i>=0&&i<LEN?KIND[i]:0}

    function mkRider(ai){return{ai,x:40,y:0,v:VMIN,vy:0,air:false,big:false,rot:0,spin:false,held:false,holdT:9,ang:0,wob:0,streak:0,lastM:-1,
      crashed:false,crashT:0,crashWhy:'',fin:false,finT:0,flips:0,push:0,ramp:0,hi:0,hplan:-1,plan:null,rplan:null,wobT:0}}
    let P=mkRider(false),A=mkRider(true);

    function launch(r,big){
      const rp=ramps[r.ramp],sz=rp?rp.sz:1;
      r.air=true;r.big=big;r.vy=big?-(150+0.2*r.v)*(0.6+0.4*sz):-r.v*0.5;r.rot=0;
      if(big){r.v+=6;if(!r.ai){pop('jump','#FF9A2E',r);beep('jump')}}
    }
    function press(r){
      r.held=true;r.holdT=0;
      if(r.crashed||r.air)return;
      const k=kindAt(r.x);
      if(k===1){
        const id=MID[Math.floor(r.x)];if(id===r.lastM)return;r.lastM=id;
        const m=mogs[id],u=(r.x-m.x0)/m.P,perfect=u>=0.05&&u<=0.24;
        r.v+=(perfect?20:14)*(r.ai?SK.boost:1);r.push=0.18;r.streak++;if(r.wob&&r.streak>=3)r.wob=0;
        spray(r,perfect?8:5);
        if(!r.ai){pop(perfect?'super':'good',perfect?'#FFD23F':'#FFFFFF',r);beep(perfect?'super':'good')}
      }else if(k===2||k===3){wrong(r)}
      else if(k===4){launch(r,true)}
      else if(k===6){r.air=true;r.big=false;r.vy=-108;r.rot=0;spray(r,4);if(!r.ai)beep('hop')}
    }
    function release(r){r.held=false}
    // Player, body controls: ducking speeds you up on a bump, jumping jumps (ramp edge, hurdles, or just a hop)
    function mogulBoost(r){
      const id=MID[Math.floor(r.x)];if(id===r.lastM)return;r.lastM=id;
      const m=mogs[id],u=(r.x-m.x0)/m.P,perfect=u>=0.05&&u<=0.24;
      r.v+=(perfect?20:14);r.push=0.25;r.streak++;if(r.wob&&r.streak>=3)r.wob=0;
      spray(r,perfect?8:5);pop(perfect?'super':'good',perfect?'#FFD23F':'#FFFFFF',r);beep(perfect?'super':'good');
    }
    function duck(r){
      if(r.crashed||r.air||r.fin)return;
      const k=kindAt(r.x);
      if(k===1)mogulBoost(r);else if(k===2)wrong(r);
      else r.push=0.25;
    }
    function hop(r){
      if(r.crashed||r.air||r.fin)return;
      const k=kindAt(r.x);
      if(k===4)launch(r,true);
      else if(k===3)wrong(r);
      else{r.air=true;r.big=false;r.vy=-108;r.rot=0;spray(r,4);beep('hop')}
    }
    function pinchHold(on){P.held=on;if(on)P.holdT=0}
    function wrong(r){
      r.streak=0;
      if(r.wob&&!r.ai){crash(r,'crash');return}
      r.wob=1;r.v=Math.max(VMIN,r.v*0.62);r.wobT=0;
      if(!r.ai){pop('oops','#E83B3B',r);beep('bad');buzz(60)}
    }
    function hitHurdle(r){
      r.streak=0;spray(r,10);
      if(r.wob&&!r.ai){crash(r,'hurdle');return}
      r.wob=1;r.wobT=0;r.v=Math.max(VMIN,r.v*0.45);
      if(!r.ai){pop('ouch','#E83B3B',r);beep('bad');buzz(80)}
    }
    function checkHurdles(r){
      const key='hit'+(r===A?1:0);
      while(r.hi<hurdles.length&&hurdles[r.hi].x+hurdles[r.hi].w<r.x-2){
        if(!hurdles[r.hi][key]&&!r.crashed){r.v+=14;if(!r.ai){pop('good','#5CC8EA',r);beep('good')}}
        r.hi++}
      const h=hurdles[r.hi];
      if(h&&!h[key]&&r.x>=h.x+1&&r.x<=h.x+h.w-1&&r.y>TY(h.x+h.w/2)-h.h+1){h[key]=1;hitHurdle(r)}
    }
    function crash(r,why){
      if(r.crashed)return;r.crashed=true;r.crashT=0;r.crashWhy=why;r.spin=false;
      if(!r.ai){beep('crash');buzz([80,40,120]);spray(r,16)}
    }
    function land(r){
      const g=TY(r.x);r.air=false;r.y=g;r.vy=0;
      const k=-r.rot,n=Math.round(k/360),rem=k-n*360;
      r.rot=0;r.spin=false;
      if(Math.abs(rem)>68){if(r.ai){r.v*=0.6}else{crash(r,'land');return}}
      r.wob=0;
      if(n>0){r.v+=26*n;r.flips+=n;if(!r.ai){pop(n>=3?'flip3':n===2?'flip2':'flip','#FFD23F',r);beep('flip')}}
      spray(r,6);
    }
    function updRider(r,dt){
      r.holdT+=dt;if(r.push>0)r.push-=dt;r.wobT+=dt;
      if(r.crashed){
        r.crashT+=dt;r.v=Math.max(0,r.v-140*dt);
        if(r.air){r.x+=r.v*dt;r.vy+=G*dt;r.y+=r.vy*dt;if(r.y>=TY(r.x)){r.air=false}}
        else{r.x+=r.v*dt;r.y=TY(r.x)}
        r.rot-=r.v*4*dt;
        return;
      }
      if(!r.air){
        const s=slopeAt(r.x);
        const kk=kindAt(r.x);r.v+=(kk===3||kk===4?25:80)*(s-SLOPE)*dt;
        r.v-=(0.0025*r.v*r.v+4)*dt;
        r.v=Math.min(Math.max(r.v,VMIN),r.wob?125:198);
        const nx=r.x+r.v*dt;
        while(r.ramp<ramps.length&&ramps[r.ramp].lip<r.x)r.ramp++;
        const rp=ramps[r.ramp];
        if(rp&&r.x<rp.lip&&nx>=rp.lip){r.x=rp.lip;r.y=TY(rp.lip-0.5);launch(r,false);r.x=nx;return}
        r.x=nx;r.y=TY(r.x);
        r.ang+=(Math.atan(s)-r.ang)*Math.min(1,dt*14);
      }else{
        r.x+=r.v*dt;r.vy+=G*dt;r.y+=r.vy*dt;
        r.spin=r.big&&r.held&&r.holdT>0.12;
        if(r.spin)r.rot-=SPIN*dt;
        else{const k=-r.rot,n=Math.floor((k+240)/360),tgt=-n*360,d=tgt-r.rot,st=SPIN*1.25*dt;r.rot+=Math.abs(d)<=st?d:Math.sign(d)*st}
        r.ang+=(Math.atan2(r.vy,r.v)*0.55-r.ang)*Math.min(1,dt*6);
        if(r.vy>0&&r.y>=TY(r.x))land(r);
      }
      if(!r.crashed)checkHurdles(r);
      if(!r.fin&&r.x>=finishX){r.fin=true;r.finT=raceT}
    }

    // Computer: gets a little better every level
    function aiSkill(lv){const l=lv-1;
      return{ph:Math.min(0.95,0.8+0.02*l),boost:l<3?0.8+0.08*l:Math.min(1.3,1+0.02*l),p:l<3?0.4+0.09*l:Math.min(0.9,0.62+0.03*l),q:Math.min(0.65,0.2+0.035*l),w:Math.max(0.03,0.1-0.008*l),pj:Math.min(0.92,0.62+0.04*l),pf:Math.min(0.6,0.2+0.05*l)}}
    let SK=aiSkill(1);
    function aiThink(a){
      if(a.crashed||a.fin)return;
      const i=Math.floor(a.x),id=i>=0&&i<LEN?MID[i]:-1;
      if(id>=0&&(!a.plan||a.plan.id!==id)){
        const m=mogs[id],roll=Math.random();let at=null;
        if(roll<SK.p)at=m.x0+m.P*(Math.random()<SK.q?0.07+Math.random()*0.15:0.26+Math.random()*0.17);
        else if(roll<SK.p+SK.w)at=m.x0+m.P*(0.6+Math.random()*0.3);
        a.plan={id,at,done:false};
      }
      if(a.plan&&!a.plan.done&&a.plan.at!=null&&a.x>=a.plan.at&&!a.air){a.plan.done=true;press(a);release(a)}
      const rp=ramps[a.ramp];
      if(rp&&!a.air&&a.x>=rp.x0-30&&(!a.rplan||a.rplan.lip!==rp.lip)){
        const j=Math.random()<SK.pj;a.rplan={lip:rp.lip,at:j?rp.x0+rp.L*(0.55+Math.random()*0.4):null,flips:j&&Math.random()<SK.pf?Math.min(rp.sz>=2?3:rp.sz>=1.4?2:1,1+(Math.random()<0.45?1:0)+(Math.random()<0.25?1:0)):0,done:false};
      }
      if(a.rplan&&!a.rplan.done&&a.rplan.at!=null&&a.x>=a.rplan.at&&!a.air){a.rplan.done=true;press(a);if(!a.rplan.flips)release(a)}
      const h=hurdles[a.hi];
      if(h&&!a.air&&a.hplan!==a.hi&&kindAt(a.x)===6&&h.x+h.w/2-a.x<a.v*(0.27+Math.random()*0.08)){a.hplan=a.hi;if(Math.random()<SK.ph){press(a);release(a)}}
      if(a.air&&a.held&&a.rplan&&(-a.rot)>=a.rplan.flips*360-150)release(a);
      if(!a.air&&a.held&&!(a.rplan&&a.rplan.done&&a.rplan.flips))release(a);
    }

    // --- Effects & sound ---
    let parts=[],pops=[];
    function spray(r,n){for(let i=0;i<n;i++)parts.push({x:r.x-3+Math.random()*4,y:r.y-1,vx:-r.v*(0.2+Math.random()*0.4),vy:-30-Math.random()*50,t:0.5+Math.random()*0.3,who:r})}
    function pop(key,col,r){pops.push({key,col,x:r.x,y:r.y-22,t:0})}
    function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(_){}}
    let AC=null;
    function initAudio(){
      if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}}
      if(AC&&AC.state==='suspended')AC.resume();
    }
    function beep(kind){
      if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);
      const S={good:[660,880,.08,'square'],super:[880,1320,.1,'square'],bad:[220,140,.18,'sawtooth'],jump:[440,990,.16,'square'],flip:[660,1760,.22,'triangle'],crash:[180,60,.35,'sawtooth'],hop:[520,780,.1,'square'],win:[523,1046,.4,'square'],tick:[440,440,.08,'square'],go:[880,880,.18,'square']}[kind];

    reticle.visible=false;scene.add(reticle);

    // Floating hint label (DOM text isn't visible on glasses)
    const LABEL_FONT='600 52px system-ui, sans-serif';
    const labelCache={};
    function labelTex(text){
      if(labelCache[text])return labelCache[text];
      const c=document.createElement('canvas'),g=c.getContext('2d');g.font=LABEL_FONT;
      const h=128,pad=56;c.width=Math.ceil(g.measureText(text).width)+pad*2;c.height=h;g.font=LABEL_FONT;
      g.fillStyle='rgba(0,0,0,0.55)';g.beginPath();g.roundRect(4,4,c.width-8,h-8,(h-8)/2);g.fill();
      g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(text,c.width/2,h/2+2);
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.userData.aspect=c.width/h;
      return labelCache[text]=t;
    }
    const label=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false,transparent:true}));
    label.renderOrder=10;label.visible=false;scene.add(label);
    function setLabel(text){const t=labelTex(text);if(label.material.map===t)return;label.material.map=t;label.material.needsUpdate=true;label.scale.set(0.045*t.userData.aspect,0.045,1)}

    scene.add(camera);

    // --- Non-AR preview: board in front of the camera, a bit from the side to show the depth ---
    function framePreview(){
      board.position.set(0,0,0);board.quaternion.identity();board.visible=true;
      const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
      const d=Math.max(BH/(2*tan),BW/(2*tan*camera.aspect))*1.25+DEPTH;
      camera.position.set(d*0.22,d*0.08,d);camera.lookAt(0,0,DEPTH/2);
    }
    framePreview();

    // =====================================================================
    // AR: find a wall, place the board, play
    // =====================================================================
    let inAR=false,handsSeen=false;
    let hitTestSource=null,hitTestRequested=false,placing=false;
    const UP=new THREE.Vector3(0,1,0);
    const tgtPos=new THREE.Vector3(),tgtQuat=new THREE.Quaternion();
    const hp=new THREE.Vector3(),hq=new THREE.Quaternion(),hs=new THREE.Vector3(),nrm=new THREE.Vector3(),xAx=new THREE.Vector3(),m4=new THREE.Matrix4();
    const camPos=new THREE.Vector3(),camQuat=new THREE.Quaternion(),fwd=new THREE.Vector3();
    let onWall=false,reticleFresh=true;

    // Board orientation: upright, facing the viewer. On a wall it lies flat on the wall.
    function orient(n){xAx.crossVectors(UP,n).normalize();m4.makeBasis(xAx,UP,n);tgtQuat.setFromRotationMatrix(m4)}
    function targetFromHit(matrix){
      m4.fromArray(matrix);m4.decompose(hp,hq,hs);
      nrm.set(0,1,0).applyQuaternion(hq);
      if(Math.abs(nrm.y)<0.5){ // vertical surface = wall
        nrm.y=0;nrm.normalize();
        if(nrm.dot(fwd.subVectors(camPos,hp))<0)nrm.negate();
        tgtPos.copy(hp);orient(nrm);return true;
      }
      // floor or table: stand the board up on it, facing you
      nrm.subVectors(camPos,hp);nrm.y=0;if(nrm.lengthSq()<1e-6)nrm.set(0,0,1);nrm.normalize();
      tgtPos.copy(hp).addScaledVector(UP,BH/2+0.02);orient(nrm);return false;
    }
    function targetFloating(){
      fwd.set(0,0,-1).applyQuaternion(camQuat);fwd.y=0;if(fwd.lengthSq()<1e-6)fwd.set(0,0,-1);fwd.normalize();
      tgtPos.copy(camPos).addScaledVector(fwd,1.3);tgtPos.y-=0.1;
      orient(nrm.copy(fwd).negate());
    }
    function startPlacing(){
      state='place';placing=true;board.visible=false;reticle.visible=true;reticleFresh=true;
      hitTestRequested=false;
    }
    function placeBoard(){
      board.position.copy(reticle.position);board.quaternion.copy(reticle.quaternion);board.visible=true;
      reticle.visible=false;label.visible=false;placing=false;
      if(hitTestSource){hitTestSource.cancel();hitTestSource=null} // no more surface detection while playing
      toMenu();beep('tick');
    }
    async function requestHitTest(session){
      const space=await session.requestReferenceSpace('viewer');
      try{return await session.requestHitTestSource({space,entityTypes:['plane']})}
      catch(e){return await session.requestHitTestSource({space})}
    }
    function updatePlacing(frame){
      const session=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();
      if(!hitTestRequested){
        hitTestRequested=true;
        requestHitTest(session).then(s=>{if(placing)hitTestSource=s;else s.cancel()}).catch(()=>{});
      }
      const cam=renderer.xr.getCamera();cam.getWorldPosition(camPos);cam.getWorldQuaternion(camQuat);
      let hit=false;
      if(hitTestSource){
        const hits=frame.getHitTestResults(hitTestSource);
        if(hits.length){const pose=hits[0].getPose(ref);if(pose){onWall=targetFromHit(pose.transform.matrix);hit=true}}
      }
      if(!hit){onWall=false;targetFloating()}
      if(reticleFresh){reticle.position.copy(tgtPos);reticle.quaternion.copy(tgtQuat);reticleFresh=false}
      else{reticle.position.lerp(tgtPos,0.25);reticle.quaternion.slerp(tgtQuat,0.25)}
      frameMat.color.set(onWall?0x7CFF9A:0xffffff);
      label.visible=true;label.position.copy(reticle.position).addScaledVector(UP,BH/2+0.06);
      setLabel((onWall?T.placeWall:T.place).replace('$',handsSeen?T.pinchL:T.tapL));
    }

    // --- Hands: pinch = press, open = release ---
    const PINCH_ON=0.015,PINCH_OFF=0.03;
    const hands=[0,1].map(i=>{
      const hand=renderer.xr.getHand(i);scene.add(hand);
      const dot=new THREE.Mesh(new THREE.SphereGeometry(0.006,10,6),new THREE.MeshBasicMaterial({color:0xffffff}));
      dot.visible=false;scene.add(dot);
      return{hand,dot,pinching:false};
    });
    const tip=new THREE.Vector3(),thumb=new THREE.Vector3();
    let pinchCount=0;
    function updateHands(){
      for(const h of hands){
        const it=h.hand.joints['index-finger-tip'],tt=h.hand.joints['thumb-tip'];
        if(!it||!tt||!it.visible||!tt.visible){h.dot.visible=false;if(h.pinching){h.pinching=false;if(--pinchCount===0)up()}continue}
        handsSeen=true;
        it.getWorldPosition(tip);tt.getWorldPosition(thumb);
        const d=tip.distanceTo(thumb);
        h.dot.position.copy(tip).add(thumb).multiplyScalar(0.5);h.dot.visible=true;
        h.dot.material.color.set(d<PINCH_OFF?0xffd23f:0xffffff);
        if(!h.pinching&&d<PINCH_ON){h.pinching=true;if(pinchCount++===0)down()}
        else if(h.pinching&&d>PINCH_OFF){h.pinching=false;if(--pinchCount===0)up()}
      }
    }
    // --- Screen tap / controller (hands are handled above) ---
    for(let i=0;i<2;i++){
      const c=renderer.xr.getController(i);
      c.addEventListener('selectstart',e=>{if(e.data&&e.data.hand)return;down()});
      c.addEventListener('selectend',e=>{if(e.data&&e.data.hand)return;up()});
      scene.add(c);
    }
    // --- Preview controls: tap / click / space ---
    renderer.domElement.addEventListener('pointerdown',e=>{if(!inAR){e.preventDefault();down()}});
    addEventListener('pointerup',()=>{if(!inAR)up()});
    addEventListener('pointercancel',()=>{if(!inAR)up()});
    addEventListener('keydown',e=>{if(inAR||e.repeat)return;
      if(e.code==='Space'||e.code==='Enter'){e.preventDefault();down()}
      else if(e.code==='KeyS'||e.code==='ArrowDown'){e.preventDefault();onDuck()}
      else if(e.code==='KeyW'||e.code==='ArrowUp'){e.preventDefault();onHop()}});
    addEventListener('keyup',e=>{if(!inAR&&(e.code==='Space'||e.code==='Enter'))up()});
    addEventListener('click',initAudio,{capture:true});

    // --- AR button ---
    if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false))info.innerHTML=T.ok;
    else info.innerHTML=T.noAr;
    document.getElementById('bar').appendChild(ARButton.createButton(renderer,{
      optionalFeatures:['hit-test','hand-tracking','dom-overlay'],
      domOverlay:{root:document.body}
    }));

    renderer.xr.addEventListener('sessionstart',()=>{
      inAR=true;document.body.classList.add('ar');info.textContent=T.inAr;
      holding=false;swallow=false;pinchCount=0;
      startPlacing();
    });
    renderer.xr.addEventListener('sessionend',()=>{
      inAR=false;placing=false;document.body.classList.remove('ar');
      reticle.visible=false;label.visible=false;
      if(hitTestSource){try{hitTestSource.cancel()}catch(_){}hitTestSource=null}
      holding=false;swallow=false;
      toMenu();framePreview();info.innerHTML=T.ok;
    });

    let last=0;
    renderer.setAnimationLoop((t,frame)=>{
      const dt=last?Math.min(0.05,Math.max(0,(t-last)/1000)):0;last=t;
      if(frame){
        updateHands();
        renderer.xr.getCamera().getWorldPosition(camPos);bodyUpdate(camPos.y,dt);
        if(placing)updatePlacing(frame);
        if(inAR&&state!=='place')info.textContent='';
      }
      holdTick(dt);
      tick(dt);
      if(board.visible)render();
      renderer.render(scene,camera);
    });

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      if(!inAR)framePreview();
    });
    if(document.fonts)document.fonts.load(`8px ${FONT}`).catch(()=>{});

    window.__ski={layers:[FR.c,BK.c],bodyUpdate,onDuck,onHop,setAR:v=>{inAR=v},get bBase(){return bBase},get state(){return state},get P(){return P},get A(){return A},down,up,startRace,get level(){return level}};
  </script>
</body>
</html>
