<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Performance Test · WebAR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
    #info { position: absolute; top: 0; left: 0; right: 0; padding: 16px; text-align: center; font-size: 15px; line-height: 1.4; pointer-events: none; }
    /* Bottom bar: back button sits left of three.js' AR button, styled to match it */
    #bar { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: stretch; gap: 10px; z-index: 3; pointer-events: none; }
    #bar > :not(#back) { position: static !important; pointer-events: auto; }
    #back {
      display: flex; align-items: center; padding: 12px 10px; border: 1px solid #fff; border-radius: 4px;
      background: rgba(0,0,0,0.1); color: #fff; font: normal 13px sans-serif; text-decoration: none;
      opacity: .5; outline: none; pointer-events: auto;
    }
    #back:hover, #back:focus-visible { opacity: 1; }
    body.ar #back { display: none; }
  </style>
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="bar"><a id="back" href="../">← EXPERIMENTS</a></div>
  <div id="info">Bare minimum: one unlit cube, no hands, no lights, no hit-test.<br>Start AR and read the fps number.</div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    renderer.xr.setFramebufferScaleFactor(0.5);
    document.body.appendChild(renderer.domElement);

    // One unlit cube, 1 m ahead
    const cube = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.1), new THREE.MeshNormalMaterial());
    cube.position.set(0, 0, -1);
    scene.add(cube);

    // FPS readout attached to the view
    const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
    const ctx = cv.getContext('2d');
    const tex = new THREE.CanvasTexture(cv);
    const fps = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false }));
    fps.scale.set(0.08, 0.02, 1);
    fps.position.set(0, -0.12, -0.6);
    camera.add(fps);
    scene.add(camera);
    let n = 0, last = performance.now();

    document.getElementById('bar').appendChild(ARButton.createButton(renderer));

    renderer.setAnimationLoop(() => {
      cube.rotation.y += 0.01;
      const now = performance.now(); n++;
      if (now - last >= 1000) {
        const f = Math.round(n * 1000 / (now - last)); n = 0; last = now;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 256, 64);
        ctx.fillStyle = f >= 50 ? '#9f9' : f >= 30 ? '#ff9' : '#f88';
        ctx.font = '600 40px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(f + ' fps', 128, 34);
        tex.needsUpdate = true;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
