<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Red Cube · WebAR</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: system-ui, sans-serif; color: #fff; }
    #info {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 16px; text-align: center; font-size: 15px; line-height: 1.4;
      background: linear-gradient(#000a, #0000); pointer-events: none; z-index: 2;
    }
    #info b { color: #ff8a80; }
    body.ar { background: transparent; }
    #debug { position: absolute; left: 8px; bottom: 8px; z-index: 3; font: 11px/1.3 ui-monospace, monospace; color: #fffc; background: #0008; padding: 4px 6px; border-radius: 4px; display: none; pointer-events: none; }
    body.ar #debug { display: block; }
    #back { position: absolute; bottom: 72px; left: 50%; transform: translateX(-50%); z-index: 3; color: #fff; opacity: .7; font-size: 14px; text-decoration: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <a id="back" href="../">← Experiments</a>
  <div id="info">Checking for WebXR AR support…</div>
  <div id="debug"></div>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    const info = document.getElementById('info');

    // --- Basic scene ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 20);
    camera.position.set(0, 0, 0.6);

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local');
    renderer.xr.setFoveation(1); // cheaper edges where supported
    renderer.xr.setFramebufferScaleFactor(0.5); // render at half resolution (big win on standalone glasses)
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 2.5));
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(1, 2, 1);
    scene.add(dir);

    // --- The cube (10 cm) ---
    const cubeGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1).translate(0, 0.05, 0); // sit on the surface
    const makeCube = () => new THREE.Mesh(
      cubeGeo,
      new THREE.MeshLambertMaterial({ color: 0xe53935 })
    );

    // Preview cube shown before entering AR (or on unsupported devices)
    const previewCube = makeCube();
    previewCube.position.set(0, -0.05, 0);
    scene.add(previewCube);

    // --- Reticle that follows detected surfaces ---
    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.05, 0.065, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    // --- Floating label above the circle (DOM text isn't visible on glasses) ---
    function makeLabelTexture(text) {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 128;
      const g = c.getContext('2d');
      g.fillStyle = 'rgba(0,0,0,0.55)';
      g.beginPath(); g.roundRect(4, 4, 504, 120, 60); g.fill();
      g.fillStyle = '#fff';
      g.font = '600 52px system-ui, sans-serif';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, 256, 66);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      return t;
    }
    const labelTex = { pinch: makeLabelTexture('Pinch to place cube'), tap: makeLabelTexture('Tap to place cube') };
    const label = new THREE.Sprite(new THREE.SpriteMaterial({ map: labelTex.tap, depthTest: false, transparent: true }));
    label.scale.set(0.24, 0.06, 1); // 24 cm wide
    label.renderOrder = 10;
    label.visible = false;
    scene.add(label);
    const reticlePos = new THREE.Vector3();

    // --- Tap to place a cube where the reticle is ---
    function placeCube(e) {
      if (e && e.data && e.data.hand) return; // hands are handled by pinch detection below
      const cube = makeCube();
      if (reticle.visible) {
        reticle.matrix.decompose(cube.position, cube.quaternion, cube.scale);
      } else {
        // No surface yet: drop the cube 50 cm in front of the camera
        const cam = renderer.xr.getCamera();
        cube.position.set(0, -0.05, -0.5).applyMatrix4(cam.matrixWorld);
      }
      scene.add(cube);
      onPlaced();
    }
    for (let i = 0; i < 2; i++) {
      const c = renderer.xr.getController(i);
      c.addEventListener('select', placeCube);
      scene.add(c);
    }

    // --- Hand tracking: pinch thumb + index to place a cube on the circle (or at your fingertips) ---
    const PINCH_ON = 0.015, PINCH_OFF = 0.03; // metres, with hysteresis
    const hands = [0, 1].map(i => {
      const hand = renderer.xr.getHand(i);
      scene.add(hand);
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.006, 12, 8),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      dot.visible = false;
      scene.add(dot);
      return { hand, dot, pinching: false };
    });
    const tip = new THREE.Vector3(), thumb = new THREE.Vector3();

    function updateHands() {
      let tracked = 0;
      for (const h of hands) {
        const it = h.hand.joints['index-finger-tip'], tt = h.hand.joints['thumb-tip'];
        if (!it || !tt || !it.visible || !tt.visible) { h.dot.visible = false; h.pinching = false; continue; }
        tracked++;
        it.getWorldPosition(tip);
        tt.getWorldPosition(thumb);
        const d = tip.distanceTo(thumb);
        h.dot.position.copy(tip).add(thumb).multiplyScalar(0.5);
        h.dot.visible = true;
        h.dot.material.color.set(d < PINCH_OFF ? 0xe53935 : 0xffffff);

        if (!h.pinching && d < PINCH_ON) {
          h.pinching = true;
          const cube = makeCube();
          if (reticle.visible) {
            // Pinch = "OK": place the cube on the surface under the circle
            reticle.matrix.decompose(cube.position, cube.quaternion, cube.scale);
          } else {
            // No surface: place it at the pinch point
            cube.position.copy(h.dot.position).y -= 0.05;
          }
          scene.add(cube);
          onPlaced();
        } else if (h.pinching && d > PINCH_OFF) {
          h.pinching = false;
        }
      }
      return tracked;
    }


    // --- FPS counter, floating in view (DOM text isn't visible on glasses) ---
    const fpsCanvas = document.createElement('canvas');
    fpsCanvas.width = 256; fpsCanvas.height = 64;
    const fpsCtx = fpsCanvas.getContext('2d');
    const fpsTex = new THREE.CanvasTexture(fpsCanvas);
    fpsTex.colorSpace = THREE.SRGBColorSpace;
    const fpsSprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: fpsTex, depthTest: false, transparent: true }));
    fpsSprite.scale.set(0.08, 0.02, 1);
    fpsSprite.position.set(0, -0.12, -0.6); // below centre of view, 60 cm ahead
    fpsSprite.renderOrder = 20;
    fpsSprite.visible = false;
    camera.add(fpsSprite);
    scene.add(camera);
    let fpsFrames = 0, fpsLast = performance.now();
    function updateFps(now) {
      fpsFrames++;
      if (now - fpsLast < 1000) return;
      const fps = Math.round(fpsFrames * 1000 / (now - fpsLast));
      fpsFrames = 0; fpsLast = now;
      fpsCtx.clearRect(0, 0, 256, 64);
      fpsCtx.fillStyle = 'rgba(0,0,0,0.5)';
      fpsCtx.fillRect(0, 0, 256, 64);
      fpsCtx.fillStyle = fps >= 50 ? '#9f9' : fps >= 30 ? '#ff9' : '#f88';
      fpsCtx.font = '600 40px ui-monospace, monospace';
      fpsCtx.textAlign = 'center'; fpsCtx.textBaseline = 'middle';
      fpsCtx.fillText(fps + ' fps', 128, 34);
      fpsTex.needsUpdate = true;
    }

    // --- AR button (needs HTTPS + a WebXR-capable browser) ---
    if (navigator.xr && await navigator.xr.isSessionSupported('immersive-ar').catch(() => false)) {
      info.innerHTML = 'Tap <b>Start AR</b>, move your phone slowly to find a surface, then tap to place cubes.';
    } else {
      info.innerHTML = 'WebXR AR isn’t available here.<br>Open this page over <b>HTTPS</b> in <b>Chrome on Android</b> (ARCore).';
    }
    document.body.appendChild(ARButton.createButton(renderer, {
      optionalFeatures: ['hit-test', 'hand-tracking', 'dom-overlay'],
      domOverlay: { root: document.body }
    }));

    // --- Hit-test plumbing ---
    let hitTestSource = null;
    let hitTestRequested = false;
    let hitTestError = '';
    let placed = 0, frames = 0, lastHits = 0, tracking = false, handsTracked = 0;
    const debug = document.getElementById('debug');

    // After MAX_CUBES placements, stop hit-testing (saves battery/CPU; cubes can still be dropped)
    const MAX_CUBES = 10;
    let hitTestStopped = false;
    function onPlaced() {
      placed++;
      if (placed >= MAX_CUBES && !hitTestStopped) {
        hitTestStopped = true;
        if (hitTestSource) hitTestSource.cancel();
        hitTestSource = null;
        reticle.visible = false;
        label.visible = false;
        info.textContent = `${MAX_CUBES} cubes placed — surface detection off`;
      }
    }

    async function requestHitTest(session) {
      const space = await session.requestReferenceSpace('viewer');
      try {
        // 'point' lets ARCore return hits on feature points before a full plane is found
        return await session.requestHitTestSource({ space, entityTypes: ['plane', 'point'] });
      } catch (e) {
        return await session.requestHitTestSource({ space });
      }
    }

    renderer.xr.addEventListener('sessionstart', () => {
      previewCube.visible = false;
      document.body.classList.add('ar');
      document.getElementById('back').style.display = 'none';
      info.textContent = 'Find a surface and tap — or pinch with your fingers on glasses';
    });
    renderer.xr.addEventListener('sessionend', () => {
      previewCube.visible = true;
      document.body.classList.remove('ar');
      document.getElementById('back').style.display = '';
      reticle.visible = false;
      label.visible = false;
      hitTestSource = null;
      hitTestRequested = false;
      hitTestStopped = false;
      placed = 0;
      info.innerHTML = 'Tap <b>Start AR</b> to try again.';
    });

    renderer.setAnimationLoop((t, frame) => {
      fpsSprite.visible = !!frame;
      if (frame) {
        updateFps(performance.now());
        const session = renderer.xr.getSession();
        const refSpace = renderer.xr.getReferenceSpace();

        if (!hitTestRequested && !hitTestStopped) {
          hitTestRequested = true;
          requestHitTest(session)
            .then(src => { if (hitTestStopped) src.cancel(); else hitTestSource = src; })
            .catch(e => { hitTestError = e.message || String(e); });
        }

        frames++;
        tracking = !!frame.getViewerPose(refSpace);
        handsTracked = updateHands();
        label.material.map = handsTracked ? labelTex.pinch : labelTex.tap;

        if (hitTestSource) {
          const hits = frame.getHitTestResults(hitTestSource);
          lastHits = hits.length;
          if (hits.length) {
            const pose = hits[0].getPose(refSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
            info.textContent = 'Tap to place a cube';
          } else {
            reticle.visible = false;
          }
        }

        label.visible = reticle.visible;
        if (label.visible) {
          reticlePos.setFromMatrixPosition(reticle.matrix);
          label.position.copy(reticlePos).y += 0.12;
        }

        if (frames % 15 === 0) {
          debug.textContent =
            `frames ${frames} · tracking ${tracking ? 'yes' : 'NO'} · hit-test ${hitTestStopped ? 'stopped' : hitTestSource ? 'ready' : (hitTestError ? 'error' : 'pending')} · hits ${lastHits} · hands ${handsTracked} · cubes ${placed}`;
        }
      } else {
        // Non-AR preview: spin the cube
        previewCube.rotation.y = t / 1000;
        previewCube.rotation.x = t / 2500;
      }
      renderer.render(scene, camera);
    });

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
