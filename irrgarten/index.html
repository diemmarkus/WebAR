  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    /* =====================================================================
       Irrgarten in AR: Jonas's hedge maze (diemmarkus/maze/irrgarten) as a
       little tilt board on your table. The hedges grow up out of the board,
       the ball is a real ball. Tilt your head forward/back and to the side
       and the board tilts with it. Everything else is the original game.
       ===================================================================== */

    const info = document.getElementById('info');
    const C={paper:'#FFD93B',dot:'#F2A81D',ink:'#16120F',lawn:'#6CC24A',hedge:'#2E9A4B',leaf:'#8FDB6A',path:'#F4D9A0',pop:'#E8322E',white:'#FFFDF6',soda:'#7FE3F0'};
    const FONT_D='Bangers, Impact, "Arial Black", sans-serif';

    // --- Board size in the room ---
    const BOARD_W=0.5;      // maze width in metres (cells get smaller as the maze grows)
    const PADC=0.5;         // lawn border around the maze, in cells
    const LIFT=0.05;        // the board sits on a little stand, so it can tilt without sinking into the table
    const MAX_TILT=THREE.MathUtils.degToRad(8);   // how far the board visibly tilts
    const HEAD_FULL=THREE.MathUtils.degToRad(16), HEAD_DEAD=THREE.MathUtils.degToRad(2);

    // --- Texts (German / English) ---
    const LANG={
      de:{title:'IRRGARTEN!',lvl:n=>'LVL '+n,pts:n=>n+' PKT',grow:'ZUGEWACHSEN',level:n=>'LEVEL '+n+'!',find:'FINDE DAS LOCH!',sink:['PLOPP!','DRIN!','LOCH!'],diff:['LEICHT','MITTEL','SCHWER'],snip:'SCHNIPP!',hurry:'SCHNELL!',rustle:['RASCHEL!','KNISTER!'],
        moved:'VERSCHOBEN!',zap:'WUSCH!',munch:'MAMPF!',over:'ZUGEWACHSEN!',stuck:'Die Wege sind zu.',fellT:'REINGEFALLEN!',fellP:'Das war das falsche Loch.',stungT:'GESTOCHEN!',stungP:'Die Wespen haben dich erwischt.',
        final:(p,l)=>p+' · LEVEL '+l,best:n=>'REKORD: '+n,startAt:'LEVEL',of:'VON',level0:'WAAGRECHT!',
        go:'$ = LOS!',again:'$ = NOCHMAL',move:'LANG HALTEN = UMSETZEN',tiltHint:'KOPF NEIGEN = TISCH KIPPEN',recal:'$ IM SPIEL = NEU WAAGRECHT',
        lvlAR:'KOPF ZUR SEITE = LEVEL',diffAR:'NICKEN = SCHWIERIGKEIT',lvlKb:'←/→ = LEVEL',diffKb:'↑/↓ = SCHWIERIGKEIT',
        pinch:'PINCH',tap:'TIPPEN',key:'LEERTASTE',pinchL:'Pinch',tapL:'Tippen',place:'$: Irrgarten hier hinstellen',placeAir:'$: hier hinstellen · besser auf einen Tisch',
        ok:'Tippe <b>Start AR</b>, schau auf einen Tisch und pinche (oder tippe), um den Irrgarten hinzustellen. Dann <b>Kopf nach vorn/hinten und zur Seite neigen</b> – der Tisch kippt mit, die Kugel rollt. Finde das Loch mit der Fahne, bevor die Hecken zuwachsen.',
        noAr:'WebXR AR gibt’s hier nicht – unten eine spielbare Vorschau: <b>Pfeiltasten/WASD</b> oder <b>ziehen</b> = kippen, <b>Leertaste</b> = los.<br>Für AR: <b>Chrome auf Android</b> oder <b>Specs</b>.',
        inAr:'Schau auf einen Tisch'},
      en:{title:'HEDGE MAZE!',lvl:n=>'LVL '+n,pts:n=>n+' PTS',grow:'OVERGROWN',level:n=>'LEVEL '+n+'!',find:'FIND THE HOLE!',sink:['PLOP!','IN!','HOLE!'],diff:['EASY','MEDIUM','HARD'],snip:'SNIP!',hurry:'HURRY!',rustle:['RUSTLE!','SWISH!'],
        moved:'MOVED!',zap:'ZAP!',munch:'MUNCH!',over:'OVERGROWN!',stuck:'The paths are shut.',fellT:'FELL IN!',fellP:'Wrong hole.',stungT:'STUNG!',stungP:'The wasps got you.',
        final:(p,l)=>p+' · LEVEL '+l,best:n=>'BEST: '+n,startAt:'LEVEL',of:'OF',level0:'LEVELLED!',
        go:'$ = GO!',again:'$ = AGAIN',move:'LONG HOLD = MOVE',tiltHint:'TILT YOUR HEAD = TILT THE TABLE',recal:'$ IN GAME = RESET LEVEL',
        lvlAR:'HEAD TO THE SIDE = LEVEL',diffAR:'NOD = DIFFICULTY',lvlKb:'←/→ = LEVEL',diffKb:'↑/↓ = DIFFICULTY',
        pinch:'PINCH',tap:'TAP',key:'SPACE',pinchL:'Pinch',tapL:'Tap',place:'$: put the maze here',placeAir:'$: put it here · a table is best',
        ok:'Tap <b>Start AR</b>, look at a table and pinch (or tap) to put the maze there. Then <b>tilt your head forward/back and to the side</b> – the table tilts with you and the ball rolls. Find the flagged hole before the hedges close in.',
        noAr:'WebXR AR isn’t available here – below is a playable preview: <b>arrow keys/WASD</b> or <b>drag</b> = tilt, <b>space</b> = go.<br>For AR use <b>Chrome on Android</b> or <b>Specs</b>.',
        inAr:'Look at a table'}};
    let langKey='de';
    try{const s=localStorage.getItem('irrgarten.lang');langKey=LANG[s]?s:((navigator.language||'de').startsWith('de')?'de':'en')}catch(_){}
    const T=LANG[langKey];
    document.documentElement.lang=langKey;

    // =====================================================================
    // Game logic: taken over unchanged from the original
    // =====================================================================
const BALL_R=.2;            // ball radius
const HOLE_R=.3;            // hole radius
const T0=.14;               // hedge thickness at level start
const T_END=1-2*BALL_R;     // thickness at which corridors are exactly as wide as the ball: shut
const ACC=34;               // cells/s² at full tilt
const MAX_V=8.5;
const WASP_V=[1.8,2.2,2.6],WASP_WAKE=.6,WASP_CHASE=2.8,WASP_LEASH=2.0;   // wasp speed per difficulty (cells/s), take-off delay and chase time (s), how far from the nest they fly              // cells/s
    const DIFFS=[{k:'easy',mul:2.2},{k:'medium',mul:1.5},{k:'hard',mul:1}];
    let diff=1;
    try{const d=+localStorage.getItem('irrgarten.diff');if(d>=0&&d<3)diff=d}catch(_){}
    const memReach=[1,1,1];
    const reachKey=()=>'irrgarten-ar.reached.'+DIFFS[diff].k;
    function reached(){try{return Math.max(1,+localStorage.getItem(reachKey())||1,memReach[diff])}catch(_){return memReach[diff]||1}}
    function setReached(l){memReach[diff]=Math.max(memReach[diff],l);try{if(l>(+localStorage.getItem(reachKey())||1))localStorage.setItem(reachKey(),l)}catch(_){}}
    const bestKey=()=>'irrgarten-ar.best.'+DIFFS[diff].k;
    let startLvl=reached();

// Recursive backtracker: a perfect maze (exactly one route between any two cells).
// h[r*cols+c] = wall on top of cell (c,r), r in 0..rows; v[r*(cols+1)+c] = wall left of cell (c,r), c in 0..cols.
function genMaze(cols,rows){
  const h=new Uint8Array((rows+1)*cols).fill(1),v=new Uint8Array(rows*(cols+1)).fill(1),seen=new Uint8Array(cols*rows);
  const stack=[[0,0]];seen[0]=1;
  while(stack.length){
    const[c,r]=stack[stack.length-1],nb=[];
    if(r>0&&!seen[(r-1)*cols+c])nb.push([c,r-1,0]);
    if(r<rows-1&&!seen[(r+1)*cols+c])nb.push([c,r+1,1]);
    if(c>0&&!seen[r*cols+c-1])nb.push([c-1,r,2]);
    if(c<cols-1&&!seen[r*cols+c+1])nb.push([c+1,r,3]);
    if(!nb.length){stack.pop();continue}
    const[nc,nr,d]=nb[Math.random()*nb.length|0];
    if(d===0)h[r*cols+c]=0;else if(d===1)h[(r+1)*cols+c]=0;else if(d===2)v[r*(cols+1)+c]=0;else v[r*(cols+1)+c+1]=0;
    seen[nr*cols+nc]=1;stack.push([nc,nr]);
  }
  // merge wall runs into long segments: fewer capsules to collide with and to draw
  const segs=[];
  for(let r=0;r<=rows;r++){let s=-1;for(let c=0;c<=cols;c++){const on=c<cols&&h[r*cols+c];if(on&&s<0)s=c;if(!on&&s>=0){segs.push({x1:s,y1:r,x2:c,y2:r});s=-1}}}
  for(let c=0;c<=cols;c++){let s=-1;for(let r=0;r<=rows;r++){const on=r<rows&&v[r*(cols+1)+c];if(on&&s<0)s=r;if(!on&&s>=0){segs.push({x1:c,y1:s,x2:c,y2:r});s=-1}}}
  // bushes: round blobs strung along every wall, each with its own size, highlight, flower or grass tuft
  const blobs=[],FL=[C.pop,C.white,C.paper,'#F59AC2'];
  for(const s of segs){
    const L=Math.hypot(s.x2-s.x1,s.y2-s.y1),n=Math.max(1,Math.round(L*4.5)),nx=(s.y2-s.y1)/L,ny=-(s.x2-s.x1)/L;
    for(let i=0;i<=n;i++){
      const t=i/n;
      blobs.push({x:s.x1+(s.x2-s.x1)*t,y:s.y1+(s.y2-s.y1)*t,nx,ny,o:(Math.random()-.5)*.45,k:.92+Math.random()*.32,
        hl:Math.random()<.7,fl:Math.random()<.13?FL[Math.random()*FL.length|0]:null,fa:Math.random()*7,
        gr:Math.random()<.4?(Math.random()<.5?1:-1):0,ga:(Math.random()-.5)*.9});
    }
  }
  return{cols,rows,h,v,segs,blobs};
}
function open(m,c,r,d){ // can you walk from cell (c,r) in direction d?
  if(d===0)return r>0&&!m.h[r*m.cols+c];
  if(d===1)return r<m.rows-1&&!m.h[(r+1)*m.cols+c];
  if(d===2)return c>0&&!m.v[r*(m.cols+1)+c];
  return c<m.cols-1&&!m.v[r*(m.cols+1)+c+1];
}
function bfs(m,sc,sr){
  const dist=new Int16Array(m.cols*m.rows).fill(-1),q=[[sc,sr]];dist[sr*m.cols+sc]=0;
  const D=[[0,-1],[0,1],[-1,0],[1,0]];
  while(q.length){const[c,r]=q.shift();for(let d=0;d<4;d++)if(open(m,c,r,d)){const nc=c+D[d][0],nr=r+D[d][1],i=nr*m.cols+nc;if(dist[i]<0){dist[i]=dist[r*m.cols+c]+1;q.push([nc,nr])}}}
  return dist;
}

let st=null;
let gdev={x:0,y:0},cal=null,needCal=true;
const joy={on:false,x:0,y:0,ox:0,oy:0,px:0,py:0},keys={};
const colsFor=l=>Math.min(12,4+l);
const secPerStep=l=>Math.max(.42,.95-.05*(l-1));
function fresh(){return{mode:'play',level:1,score:0,parts:[],banner:null,diff}}
function usedCells(){const u=new Set();for(const o of[...st.shears,...st.caters,...(st.nest?[st.nest]:[]),...(st.tele||[]),...(st.dot?[st.dot]:[]),...(st.pit?[st.pit]:[]),st.hole])u.add((o.x|0)+','+(o.y|0));return u}
function extrasNow(){return st.shears.length+st.caters.length+(st.nest?1:0)+(st.tele?1:0)+(st.dot?1:0)+(st.pit?1:0)}
let bag=[],tbag=[],wbag=[],gbag=[],kbag=[];
function flip(b){if(!b.length)b.push(...[true,false].sort(()=>Math.random()-.5));return b.pop()}
function newLevel(l){
  st.level=l;if(st.mode!=='start')setReached(l);
  const cols=colsFor(l);
  const rows=Math.max(cols,Math.min(16,Math.round(cols*1.25)));   // a table board: a bit deeper than wide
  const m=genMaze(cols,rows);
  // start in a random corner, hole in the cell farthest away along the paths
  const corners=[[0,0],[cols-1,0],[0,rows-1],[cols-1,rows-1]],[sc,sr]=corners[Math.random()*4|0];
  const dist=bfs(m,sc,sr);let best=0;for(let i=1;i<dist.length;i++)if(dist[i]>dist[best])best=i;
  st.maze=m;st.hole={x:best%cols+.5,y:(best/cols|0)+.5};
  st.ball={x:sc+.5,y:sr+.5,vx:0,vy:0,ru:0,rv:0,scale:1};
  // power-ups always sit in a dead end (a detour you have to choose), preferably in the middle part of the route
  const maxd=dist[best],deadEnds=[];
  for(let i=0;i<dist.length;i++){
    if(i===best||dist[i]===0)continue;
    const c=i%cols,r=i/cols|0;let exits=0;for(let d=0;d<4;d++)if(open(m,c,r,d))exits++;
    if(exits===1)deadEnds.push({x:c+.5,y:r+.5,w:dist[i]>=maxd*.25&&dist[i]<=maxd*.8?4:1});
  }
  const cand=deadEnds;
  const take=n=>{const out=[];for(;n>0&&cand.length;n--){
    let tot=cand.reduce((a,c)=>a+c.w,0),pick=Math.random()*tot,i=0;
    while(i<cand.length-1&&pick>cand[i].w){pick-=cand[i].w;i++}
    out.push({x:cand[i].x,y:cand[i].y,taken:false,ph:Math.random()*7});cand.splice(i,1);
  }return out};
  // power-ups take turns: each run of three levels has one with shears, one with a caterpillar and one with nothing, shuffled
  if(!bag.length)bag.push(...['shears','cater','none'].sort(()=>Math.random()-.5));
  const kind=bag.pop(),many=1;
  st.shears=take(kind==='shears'?many:0);
  st.caters=take(kind==='cater'?many:0);
  st.munchers=[];st.rate=1;
  // at most 2 extras per level: power-up first, then a random pick among the hazards whose turn it is
  const want=[];
  if(l>=3&&flip(wbag))want.push('nest');
  if(l>=2&&flip(tbag))want.push('tele');
  if(l>=2&&flip(gbag))want.push('dot');
  if(l>=2&&flip(kbag))want.push('pit');
  want.sort(()=>Math.random()-.5);
  const allow=new Set(want.slice(0,Math.max(0,2-st.shears.length-st.caters.length)));
  st.dot=null;st.pit=null;st.tele=null;
  // wasp nest, every other level from level 3 (shuffled), somewhere along the middle of the maze
  st.nest=null;st.wasps=[];
  if(allow.has('nest')){
    {
      const used=new Set([...st.shears,...st.caters].map(o=>(o.x|0)+','+(o.y|0)));
      const C2=[];for(let i=0;i<dist.length;i++){if(i===best||dist[i]<Math.max(3,maxd*.25)||dist[i]>maxd*.85)continue;if(!used.has((i%cols)+','+(i/cols|0)))C2.push(i)}
      if(C2.length){const i=C2[Math.random()*C2.length|0];st.nest={x:i%cols+.5,y:(i/cols|0)+.5,cool:0}}
    }
  }
  // teleporter pair, every other level from level 2 (shuffled): one end in the first half of the route, the other far away from it
  st.tele=null;st.tpLock=-1;
  if(allow.has('tele')){
    {
      const used=new Set([...st.shears,...st.caters,...(st.nest?[st.nest]:[])].map(o=>(o.x|0)+','+(o.y|0)));used.add(sc+','+sr);used.add((best%cols)+','+(best/cols|0));
      const free=i=>!used.has((i%cols)+','+(i/cols|0));
      const A=[];for(let i=0;i<dist.length;i++)if(free(i)&&dist[i]>=maxd*.15&&dist[i]<=maxd*.5)A.push(i);
      if(A.length){
        const a=A[Math.random()*A.length|0],da=bfs(m,a%cols,a/cols|0);let far=0;for(const v of da)far=Math.max(far,v);
        const B=[];for(let i=0;i<da.length;i++)if(free(i)&&i!==a&&da[i]>=far*.45)B.push(i);
        if(B.length){const b2=B[Math.random()*B.length|0];
          st.tele=[{x:a%cols+.5,y:(a/cols|0)+.5},{x:b2%cols+.5,y:(b2/cols|0)+.5}]}
      }
    }
  }
  // green dot, every other level from level 2 (shuffled), if there is still room for an extra: roll over it and the hole moves
  st.dot=null;st.holeFrom=null;st.holeT=1;
  if(allow.has('dot')){
    {
      const used=usedCells();used.add(sc+','+sr);
      const D=[];for(let i=0;i<dist.length;i++){const c=i%cols,r=i/cols|0;if(used.has(c+','+r)||dist[i]<maxd*.2||dist[i]>maxd*.8)continue;
        let e=0;for(let d=0;d<4;d++)if(open(m,c,r,d))e++;if(e>=2)D.push(i)}
      if(D.length){const i=D[Math.random()*D.length|0];st.dot={x:i%cols+.5,y:(i/cols|0)+.5}}
    }
  }
  // black hole (no flag): never on the real route from start to the hole, preferably in a dead end
  if(allow.has('pit')){
    const dh=bfs(m,best%cols,best/cols|0),used=usedCells();used.add(sc+','+sr);
    const P=[],dd=st.dot?bfs(m,st.dot.x|0,st.dot.y|0):null,dotToHole=dd?dd[best]:0;
    for(let i=0;i<dist.length;i++){const c=i%cols,r=i/cols|0;
      if(used.has(c+','+r)||dist[i]<2||dist[i]+dh[i]===maxd)continue;
      if(dd&&dd[i]+dh[i]===dotToHole)continue;   // nor on the way from the green dot to the hole   // on the route: start→cell→hole is exactly the shortest way
      let e=0;for(let d=0;d<4;d++)if(open(m,c,r,d))e++;
      for(let k=0;k<(e===1?4:1);k++)P.push(i)}
    if(P.length){const i=P[Math.random()*P.length|0];st.pit={x:i%cols+.5,y:(i/cols|0)+.5}}
  }
  st.levelT=0;st.dur=(6+dist[best]*secPerStep(l))*DIFFS[st.diff].mul;st.cutPending=0;st.p=0;st.t=T0;st.hurried=false;st.sunk=false;st.rustleCD=0;
  st.banner={text:T.level(l),sub:T.find,t:1.8,max:1.8};
  onNewMaze();
}

    // gravity in the maze plane: from your head in AR, from keys / dragging in the preview
    let headG={x:0,y:0};
    function gravity(){
      let x,y;
      if(inAR){x=headG.x;y=headG.y}
      else{
        const kx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),ky=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
        x=joy.x*.5+kx*.4;y=joy.y*.5+ky*.4;
      }
      const L=Math.hypot(x,y);
      if(L<.03)return{x:0,y:0};
      if(L>.6){x*=.6/L;y*=.6/L}
      return{x,y};
    }

function popText(x,y,text,col){st.parts.push({type:'pop',x,y,t:0,life:.7,rot:(Math.random()-.5)*.5,text,col})}
function leaves(x,y,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*7,v=(.6+Math.random())*spd;
    st.parts.push({type:'leaf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.6,rot:Math.random()*7,vr:(Math.random()-.5)*12,t:0,life:.6+Math.random()*.4})}
}
function collide(b){
  const hr=st.t/2,R=BALL_R+hr;
  for(let it=0;it<3;it++){
    for(const s of st.maze.segs){
      if(b.x<Math.min(s.x1,s.x2)-R||b.x>Math.max(s.x1,s.x2)+R||b.y<Math.min(s.y1,s.y2)-R||b.y>Math.max(s.y1,s.y2)+R)continue;
      const sx=s.x2-s.x1,sy=s.y2-s.y1,L2=sx*sx+sy*sy;
      const u=Math.max(0,Math.min(1,((b.x-s.x1)*sx+(b.y-s.y1)*sy)/L2));
      const qx=s.x1+sx*u,qy=s.y1+sy*u,dx=b.x-qx,dy=b.y-qy,d2=dx*dx+dy*dy;
      if(d2>=R*R||d2<1e-10)continue;
      const d=Math.sqrt(d2),nx=dx/d,ny=dy/d;
      b.x=qx+nx*R;b.y=qy+ny*R;
      const vn=b.vx*nx+b.vy*ny;
      if(vn<0){
        if(-vn>2.2&&st.rustleCD<=0){
          st.rustleCD=.35;leaves(qx+nx*hr,qy+ny*hr,4,1.4);
          if(-vn>4)popText(qx+nx*hr,qy+ny*hr,T.rustle[Math.random()*T.rustle.length|0],C.leaf);
        }

    const fh=new THREE.Vector3(),rh=new THREE.Vector3(),gw=new THREE.Vector3(),invQ=new THREE.Quaternion();
    let pitch0=0,roll0=0,pitchBase=null,armRoll=true,armNod=true;
    const dead=a=>Math.sign(a)*Math.max(0,Math.abs(a)-HEAD_DEAD);
    function headUpdate(dt){
      fwd.set(0,0,-1).applyQuaternion(camQuat);rgt.set(1,0,0).applyQuaternion(camQuat);
      const pitch=Math.asin(THREE.MathUtils.clamp(fwd.y,-1,1)),roll=Math.asin(THREE.MathUtils.clamp(rgt.y,-1,1));
      if(needCal){pitch0=pitch;roll0=roll;needCal=false}
      // game: head forward = ball rolls away from you, head to the left = ball rolls left (also when you walk around the board)
      rh.set(rgt.x,0,rgt.z);if(rh.lengthSq()<1e-6)rh.set(1,0,0);rh.normalize();fh.crossVectors(UP,rh);
      const k=.6/(HEAD_FULL-HEAD_DEAD);
      gw.copy(fh).multiplyScalar(-dead(pitch-pitch0)*k).addScaledVector(rh,-dead(roll-roll0)*k);
      board.getWorldQuaternion(invQ).invert();gw.applyQuaternion(invQ);
      headG.x=gw.x;headG.y=gw.z;
      // menus: head to the side = level, a nod = difficulty
      if(appState==='menu'||appState==='result'){
        const rd=THREE.MathUtils.radToDeg(roll);
        if(armRoll&&Math.abs(rd)>14){armRoll=false;changeLevel(rd>0?-1:1)}else if(Math.abs(rd)<6)armRoll=true;
        if(pitchBase==null)pitchBase=pitch;
        const nd=THREE.MathUtils.radToDeg(pitch-pitchBase);
        if(armNod&&nd<-14){armNod=false;changeDiff(1)}else if(Math.abs(nd)<5)armNod=true;
        pitchBase+=(pitch-pitchBase)*Math.min(1,dt*.8);
      }else pitchBase=null;
    }

    // board follows the ball's gravity visually
    let tiltX=0,tiltZ=0;
    function render3D(dt){
      const m=st.maze;if(!m)return;
      updateHedges();
      let jx=0,jz=0;
      if(st.mode==='play'&&st.p>.8){const a=(st.p-.8)*.12;jx=(Math.random()-.5)*a;jz=(Math.random()-.5)*a}
      hedgeG.position.set(jx,0,jz);
      const g=appState==='game'&&st.mode==='play'?gravity():{x:0,y:0};
      tiltZ+=(-g.x/.6*MAX_TILT-tiltZ)*Math.min(1,dt*8);tiltX+=(g.y/.6*MAX_TILT-tiltX)*Math.min(1,dt*8);
      tiltG.rotation.set(tiltX,0,tiltZ);
      // ball: rolls for real
      const b=st.ball,sc=Math.max(0,b.scale);
      ball.visible=sc>.02;ball.scale.setScalar(Math.max(.001,sc));
      ball.position.set(b.x,BALL_R*sc-(1-sc)*.18,b.y);
      if(b.px!=null){const dx=b.x-b.px,dz=b.y-b.py,d=Math.hypot(dx,dz);
        if(d>1e-5&&d<1){rq.setFromAxisAngle(ax.set(dz/d,0,-dx/d),d/BALL_R);ballMesh.quaternion.premultiply(rq)}}
      b.px=b.x;b.py=b.y;
      // flag
      const hp=holePos();flag.position.set(hp.x,(hp.lift||0)*.5,hp.y);flag.scale.setScalar(1-(hp.lift||0)*.35);
      flag.userData.cloth.rotation.y=Math.sin(clock*6)*.25;
      drawFloor();drawTop();
    }
    const rq=new THREE.Quaternion(),ax=new THREE.Vector3();

    // =====================================================================
    // Placement: find a table, put the board on it, facing you
    // =====================================================================
    let inAR=false,handsSeen=false,hitTestSource=null,hitTestRequested=false,placing=false,onTable=false,reticleFresh=true;
    const tgtPos=new THREE.Vector3(),tgtQuat=new THREE.Quaternion(),hp3=new THREE.Vector3(),hq=new THREE.Quaternion(),hs=new THREE.Vector3(),nrm=new THREE.Vector3(),m4=new THREE.Matrix4();
    const reticle=new THREE.Group();
    const frameMat=new THREE.LineBasicMaterial({color:0xffffff});
    {
      const pts=[];const c=.12;
      for(const[sx,sz]of[[-1,-1],[1,-1],[1,1],[-1,1]])pts.push(sx*.5,0,sz*.5, sx*(.5-c),0,sz*.5, sx*.5,0,sz*.5, sx*.5,0,sz*(.5-c));
      const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
      const corners=new THREE.LineSegments(geo,frameMat);reticle.add(corners);reticle.userData.corners=corners;
      const fill=new THREE.Mesh(unitPlane,new THREE.MeshBasicMaterial({color:0x6CC24A,transparent:true,opacity:.25,depthWrite:false}));reticle.add(fill);reticle.userData.fill=fill;
    }
    reticle.visible=false;scene.add(reticle);
    function updateReticleSize(){for(const k of['corners','fill'])reticle.userData[k].scale.set(bw,1,bd)}
    function faceCamera(){
      fwd.subVectors(camPos,tgtPos);fwd.y=0;if(fwd.lengthSq()<1e-6)fwd.set(0,0,1);fwd.normalize();
      tgtQuat.setFromAxisAngle(UP,Math.atan2(fwd.x,fwd.z));
    }
    function targetFromHit(matrix){
      m4.fromArray(matrix);m4.decompose(hp3,hq,hs);
      nrm.set(0,1,0).applyQuaternion(hq);
      if(nrm.y<.75)return false;    // only horizontal surfaces
      tgtPos.copy(hp3);faceCamera();return true;
    }
    function targetFloating(){
      fwd.set(0,0,-1).applyQuaternion(camQuat);fwd.y=0;if(fwd.lengthSq()<1e-6)fwd.set(0,0,-1);fwd.normalize();
      tgtPos.copy(camPos).addScaledVector(fwd,.6);tgtPos.y-=.45;faceCamera();
    }
    // floating hint label
    const LABEL_FONT='600 52px system-ui, sans-serif',labelCache={};
    function labelTex(text){
      if(labelCache[text])return labelCache[text];
      const c=document.createElement('canvas'),g=c.getContext('2d');g.font=LABEL_FONT;
      const h=128,pad=56;c.width=Math.ceil(g.measureText(text).width)+pad*2;c.height=h;g.font=LABEL_FONT;
      g.fillStyle='rgba(0,0,0,0.55)';g.beginPath();g.roundRect(4,4,c.width-8,h-8,(h-8)/2);g.fill();
      g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';g.fillText(text,c.width/2,h/2+2);
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.userData.aspect=c.width/h;
      return labelCache[text]=t;
    }
    const label=new THREE.Sprite(new THREE.SpriteMaterial({depthTest:false,transparent:true}));
    label.renderOrder=10;label.visible=false;scene.add(label);
    function setLabel(text){const t=labelTex(text);if(label.material.map===t)return;label.material.map=t;label.material.needsUpdate=true;label.scale.set(.04*t.userData.aspect,.04,1)}

    function startPlacing(){appState='place';placing=true;board.visible=false;reticle.visible=true;reticleFresh=true;hitTestRequested=false}
    function placeBoard(){
      board.position.copy(reticle.position);board.quaternion.copy(reticle.quaternion);board.visible=true;
      reticle.visible=false;label.visible=false;placing=false;
      if(hitTestSource){hitTestSource.cancel();hitTestSource=null}
      toMenu();
    }
    async function requestHitTest(session){
      const space=await session.requestReferenceSpace('viewer');
      try{return await session.requestHitTestSource({space,entityTypes:['plane']})}
      catch(e){return await session.requestHitTestSource({space})}
    }
    function updatePlacing(frame){
      const session=renderer.xr.getSession(),ref=renderer.xr.getReferenceSpace();
      if(!hitTestRequested){hitTestRequested=true;requestHitTest(session).then(s=>{if(placing)hitTestSource=s;else s.cancel()}).catch(()=>{})}
      let hit=false;
      if(hitTestSource){
        for(const h of frame.getHitTestResults(hitTestSource)){const pose=h.getPose(ref);if(pose&&targetFromHit(pose.transform.matrix)){hit=true;break}}
      }
      onTable=hit;if(!hit)targetFloating();
      if(reticleFresh){reticle.position.copy(tgtPos);reticle.quaternion.copy(tgtQuat);reticleFresh=false}
      else{reticle.position.lerp(tgtPos,.25);reticle.quaternion.slerp(tgtQuat,.25)}
      frameMat.color.set(onTable?0x7CFF9A:0xffffff);
      label.visible=true;label.position.copy(reticle.position).addScaledVector(UP,.12);
      setLabel((onTable?T.place:T.placeAir).replace('$',handsSeen?T.pinchL:T.tapL));
    }

    // --- Preview (no AR): board in front of the camera, seen from above at an angle ---
    function framePreview(){
      board.position.set(0,0,0);board.quaternion.identity();board.visible=true;
      const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),span=Math.max(bd+.3,(bw+.06)/camera.aspect);
      const d=span/(2*tan)*1.05;
      camera.position.set(0,d*.78,d*.62);camera.lookAt(0,.06,-.03);
    }

    // =====================================================================
    // Input: pinch / screen tap / space = the button
    // =====================================================================
    let holding=false,holdT=0,swallow=false,downState='';
    function down(){
      if(holding)return;holding=true;holdT=0;downState=appState;
      if(appState==='place'){placeBoard();swallow=true;return}
      if(appState==='game'){
        if(inAR&&st.mode==='play'){needCal=true;st.banner={text:T.level0,t:.9,max:.9}}
        swallow=true;return;
      }
    }
    function up(){
      if(!holding)return;holding=false;
      if(swallow){swallow=false;return}
      if((appState==='menu'||appState==='result')&&downState===appState&&clock-resultAt>.5)begin();
    }
    function holdTick(dt){
      if(!holding)return;holdT+=dt;
      if(inAR&&holdT>1.2&&(appState==='menu'||appState==='result')){swallow=true;startPlacing()}
    }
    // hands: pinch = press, open = release
    const PINCH_ON=0.015,PINCH_OFF=0.03;
    const hands=[0,1].map(i=>{
      const hand=renderer.xr.getHand(i);scene.add(hand);
      const dot=new THREE.Mesh(new THREE.SphereGeometry(0.006,10,6),new THREE.MeshBasicMaterial({color:0xffffff}));
      dot.visible=false;scene.add(dot);
      return{hand,dot,pinching:false};
    });
    const tip=new THREE.Vector3(),thumb=new THREE.Vector3();
    let pinchCount=0;
    function updateHands(){
      for(const h of hands){
        const it=h.hand.joints['index-finger-tip'],tt=h.hand.joints['thumb-tip'];
        if(!it||!tt||!it.visible||!tt.visible){h.dot.visible=false;if(h.pinching){h.pinching=false;if(--pinchCount===0)up()}continue}
        handsSeen=true;
        it.getWorldPosition(tip);tt.getWorldPosition(thumb);
        const d=tip.distanceTo(thumb);
        h.dot.position.copy(tip).add(thumb).multiplyScalar(0.5);h.dot.visible=true;
        h.dot.material.color.set(d<PINCH_OFF?0xFFD93B:0xffffff);
        if(!h.pinching&&d<PINCH_ON){h.pinching=true;if(pinchCount++===0)down()}
        else if(h.pinching&&d>PINCH_OFF){h.pinching=false;if(--pinchCount===0)up()}
      }
    }
    for(let i=0;i<2;i++){
      const c=renderer.xr.getController(i);
      c.addEventListener('selectstart',e=>{if(e.data&&e.data.hand)return;down()});
      c.addEventListener('selectend',e=>{if(e.data&&e.data.hand)return;up()});
      scene.add(c);
    }
    // preview: drag = tilt (like the original without motion sensor), click / space = button, arrows = tilt or menu
    const el=renderer.domElement;
    el.addEventListener('pointerdown',e=>{
      if(inAR)return;e.preventDefault();
      if(appState==='game'&&st.mode==='play'){joy.on=true;joy.ox=e.clientX;joy.oy=e.clientY;joy.x=joy.y=0;try{el.setPointerCapture(e.pointerId)}catch(_){}}
      else down();
    });
    el.addEventListener('pointermove',e=>{
      if(!joy.on)return;let dx=(e.clientX-joy.ox)/60,dy=(e.clientY-joy.oy)/60;const L=Math.hypot(dx,dy);if(L>1){dx/=L;dy/=L}joy.x=dx;joy.y=dy;
    });
    function joyOff(){joy.on=false;joy.x=joy.y=0}
    addEventListener('pointerup',()=>{if(inAR)return;joyOff();up()});
    addEventListener('pointercancel',()=>{if(inAR)return;joyOff();up()});
    addEventListener('keydown',e=>{
      if(inAR)return;const k=e.key.length===1?e.key.toLowerCase():e.key;
      if(appState==='game'){if(/^Arrow|^[wasd]$/.test(k)){keys[k]=true;e.preventDefault()}return}
      if(e.repeat)return;
      if(e.code==='Space'||e.code==='Enter'){e.preventDefault();down()}
      else if(k==='ArrowLeft'||k==='a'){e.preventDefault();changeLevel(-1)}
      else if(k==='ArrowRight'||k==='d'){e.preventDefault();changeLevel(1)}
      else if(k==='ArrowUp'||k==='w'){e.preventDefault();changeDiff(-1)}
      else if(k==='ArrowDown'||k==='s'){e.preventDefault();changeDiff(1)}
    });
    addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;if(!inAR&&(e.code==='Space'||e.code==='Enter'))up()});
    addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joyOff()});

    // =====================================================================
    // Start
    // =====================================================================
    toMenu();

    if(navigator.xr&&await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false))info.innerHTML=T.ok;
    else info.innerHTML=T.noAr;
    document.getElementById('bar').appendChild(ARButton.createButton(renderer,{
      optionalFeatures:['hit-test','hand-tracking','dom-overlay'],
      domOverlay:{root:document.body}
    }));
    renderer.xr.addEventListener('sessionstart',()=>{
      inAR=true;document.body.classList.add('ar');info.textContent=T.inAr;
      holding=false;swallow=false;pinchCount=0;joyOff();
      startPlacing();
    });
    renderer.xr.addEventListener('sessionend',()=>{
      inAR=false;placing=false;document.body.classList.remove('ar');
      reticle.visible=false;label.visible=false;
      if(hitTestSource){try{hitTestSource.cancel()}catch(_){}hitTestSource=null}
      holding=false;swallow=false;
      toMenu();framePreview();info.innerHTML=T.ok;
    });

    let lastT=0;
    renderer.setAnimationLoop((t,frame)=>{
      const dt=lastT?Math.min(.05,Math.max(0,(t-lastT)/1000)):0;lastT=t;
      if(frame){
        updateHands();
        const cam=renderer.xr.getCamera();cam.getWorldPosition(camPos);cam.getWorldQuaternion(camQuat);
        if(placing)updatePlacing(frame);else headUpdate(dt);
        if(appState!=='place')info.textContent='';
      }
      fpsTick();
      holdTick(dt);
      tick(dt);
      if(board.visible){render3D(dt);drawPanel()}
      renderer.render(scene,camera);
    });

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      if(!inAR)framePreview();
    });
    if(document.fonts)document.fonts.load(`40px Bangers`).then(()=>{panelKey='';topDirty=true}).catch(()=>{});

    window.__irrAR={get st(){return st},get app(){return appState},keys,down,up,begin,changeLevel,changeDiff,setHead:(x,y)=>{headG.x=x;headG.y=y},setAR:v=>{inAR=v},layers:{floor:FL.c,top:TOP.c,panel:PN.c}};
  </script>
</body>
</html>
