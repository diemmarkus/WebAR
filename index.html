<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebAR Experiments</title>
  <style>
    :root { --bg: #0f1012; --card: #1a1c20; --line: #2a2d33; --text: #f2f2f2; --muted: #9aa0a8; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 20px 64px; }
    h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: -0.02em; }
    .lede { color: var(--muted); margin: 0 0 32px; }
    .note {
      font-size: 14px; color: var(--muted); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 28px;
    }
    .note b { color: var(--text); font-weight: 600; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
    a.card {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      color: inherit; text-decoration: none; transition: border-color .15s, transform .15s;
    }
    a.card:hover, a.card:focus-visible { border-color: #555; transform: translateY(-1px); }
    .thumb { flex: none; width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: #24262b; }
    .title { font-weight: 600; font-size: 17px; }
    .desc { color: var(--muted); font-size: 14px; }
    .num { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
    #support { font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>WebAR Experiments</h1>
    <p class="lede">Small augmented-reality tests that run in the browser.</p>

    <div class="note">
      Best in <b>Chrome on Android</b> (ARCore). iPhone Safari doesn't support WebXR yet.<br />
      This device: <span id="support">checking…</span>
    </div>

    <ul>
      <li>
        <a class="card" href="red-cube/">
          <div class="thumb" aria-hidden="true">
            <svg width="34" height="34" viewBox="0 0 34 34">
              <polygon points="17,3 31,10 17,17 3,10" fill="#ff6b61" />
              <polygon points="3,10 17,17 17,31 3,24" fill="#c62828" />
              <polygon points="31,10 17,17 17,31 31,24" fill="#e53935" />
            </svg>
          </div>
          <div>
            <div class="title">Red Cube</div>
            <div class="desc">Find a surface and tap to place red cubes.</div>
          </div>
          <span class="num">01</span>
        </a>
      </li>
    </ul>
  </main>

  <script>
    const el = document.getElementById('support');
    if (navigator.xr && navigator.xr.isSessionSupported) {
      navigator.xr.isSessionSupported('immersive-ar')
        .then(ok => { el.textContent = ok ? 'AR supported ✓' : 'AR not supported'; })
        .catch(() => { el.textContent = 'AR not supported'; });
    } else {
      el.textContent = 'AR not supported';
    }
  </script>
</body>
</html>
